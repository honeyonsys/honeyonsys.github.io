<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stream Side Banner</title>
    <style>
      /* A deliberately empty canvas for the video source / streaming software. */
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #fff;
      }

      .side-banner {
        position: fixed;
        top: 0;
        right: 0;
        height: 100vh;
        height: 100dvh;
        width: auto;
        max-width: 100vw;
        object-fit: contain;
        object-position: right center;
        display: block;
      }
    </style>
  </head>
  <body>
    <img
      class="side-banner"
      src="610ba6ec-8474-4e3a-a923-0a21f1a67696.jpeg"
      alt="Stream side banner"
    />
  </body>
</html>
